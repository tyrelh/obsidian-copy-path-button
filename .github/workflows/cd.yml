name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'semver tag vMAJOR.MINOR.PATCH to release'
        required: true
        type: string

jobs:
  lint:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Work out the next version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Latest semver tag, or v0.0.0 for the very first release.
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          last=${last:-v0.0.0}
          IFS=. read -r major minor patch <<<"${last#v}"

          # The PR this commit landed from decides which number moves.
          labels=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            --jq '.[0].labels[]?.name' 2>/dev/null || true)

          if grep -qx 'release:major' <<<"$labels"; then
            major=$((major + 1)); minor=0; patch=0
          elif grep -qx 'release:minor' <<<"$labels"; then
            minor=$((minor + 1)); patch=0
          else
            patch=$((patch + 1))
          fi

          echo "tag=v${major}.${minor}.${patch}" >>"$GITHUB_OUTPUT"

      - name: Verify manifest version matches tag
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          MANIFEST_VERSION=$(jq -r '.version' manifest.json)
          if [ "$VERSION" != "$MANIFEST_VERSION" ]; then
            echo "Tag version $VERSION does not match manifest version $MANIFEST_VERSION"
            exit 1
          fi
          echo "Manifest version $MANIFEST_VERSION matches tag"

      - name: Collect release assets
        id: assets
        run: |
          {
            echo 'files<<EOF'
            echo "main.js"
            echo "manifest.json"
            if [ -f styles.css ]; then
              echo "styles.css"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.assets.outputs.files }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          FILES: ${{ steps.assets.outputs.files }}
        run: |
          set -euo pipefail
          mapfile -t files <<<"$FILES"
          gh release create "$TAG" "${files[@]}" --target "$GITHUB_SHA" --generate-notes
