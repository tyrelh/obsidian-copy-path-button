name: CD

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'semver tag vMAJOR.MINOR.PATCH to release'
        required: true
        type: string

jobs:
  lint:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Resolve release tag
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG"

      - name: Validate semver tag
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          if ! echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid semver tag: $TAG"
            exit 1
          fi
          echo "Tag $TAG is valid semver"

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.resolve.outputs.tag }}

      - name: Verify manifest version matches tag
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          MANIFEST_VERSION=$(jq -r '.version' manifest.json)
          if [ "$VERSION" != "$MANIFEST_VERSION" ]; then
            echo "Tag version $VERSION does not match manifest version $MANIFEST_VERSION"
            exit 1
          fi
          echo "Manifest version $MANIFEST_VERSION matches tag"

      - name: Collect release assets
        id: assets
        run: |
          {
            echo 'files<<EOF'
            echo "main.js"
            echo "manifest.json"
            if [ -f styles.css ]; then
              echo "styles.css"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@c074443f1aee8d050a119193a9002f11b21c4d6a # v2.2.3
        with:
          subject-path: ${{ steps.assets.outputs.files }}

      - uses: softprops/action-gh-release@01587a9c01874662bb9d0d7ad297910eff027368 # v2.2.0
        with:
          tag_name: ${{ steps.resolve.outputs.tag }}
          files: ${{ steps.assets.outputs.files }}
          generate_release_notes: true
